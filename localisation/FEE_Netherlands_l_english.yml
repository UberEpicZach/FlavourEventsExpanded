l_english:
 FEE_Netherlands_Events.1.T: "Province Named Generality Lands"
 FEE_Netherlands_Events.1.D: "Due to the challenges of administrating the population of it, the States-General has decided to name the region Generaliteitslande, or \"Generality Lands.\" This means that instead of being subject to one of the seven United Provinces, it will be governed directly by the States-General itself. \nThese regions are not represented in the central government - which might be best, considering their beliefs - and have no States-Provincial of their own.\n\nOne day we might have reason to let them be represented and govern themselves, but for now holding them as a dependent territory is best."
 FEE_Netherlands_Events.1.OPT1: "The States-General votes unanimously in favor."

 FEE_Netherlands_Events.2.T: "Province Achieves Representation"
 FEE_Netherlands_Events.2.D: "After showing signs of development and stability, the region of it has finally been granted the right to its own administration. This comes with the responsibility of sending representatives to the States-General, and in time the former Generality Lands might even earn its own States-Provincial!"
 FEE_Netherlands_Events.2.OPT1: "We are all people of the Netherlands, after all."

 FEE_Netherlands_Events.3.T: "Arrival in Indonesia"
 FEE_Netherlands_Events.3.D: "Our expedition to the East Indies has finally arrived! This morning we received news that after careful negotiations with the Sultan of Banten that our brave merchants and explorers have established a trading post there. Our merchants have also received an offer from the Prince of Jayakarta to construct a warehouse nearby. Should we accept? "
 FEE_Netherlands_Events.3.OPT1: "We shall take the good Prince up on his offer."
 FEE_Netherlands_Events.3.OPT2: "We should steer clear of this. "

 FEE_Netherlands_Events.4.T: "Founding of Batavia"
 FEE_Netherlands_Events.4.D: "We have had many trading ports in Asia since the VOC were given a monopoly over trade in Asia. One of our biggest was the warehouse at Jayakarta, however after long tensions with the English and the Natives of the region, the natives attempted to destroy the warehouses. In retaliation, the brave troops of the East India Company razed Jayakarta to the ground! However, VOC officials are now proposing to construct an organised Dutch city upon its ruins called Batavia and are asking for a grant."
 FEE_Netherlands_Events.4.OPT1: "Let us propose them to buy the province!"
 FEE_Netherlands_Events.4.OPT2: "Let's build it!"
 FEE_Netherlands_Events.4.OPT3: "These acts are barbaric!"

 FEE_Netherlands_Events.5.T: "A Trade proposal from [FROM.GetName]"
 FEE_Netherlands_Events.5.D: "An embassy from [FROM.GetName] has reached our wonderful province of [630.GetName] and has brought its purchase, the sum of gold they have put on the table is nothing to shy from."
 FEE_Netherlands_Events.5.OPT1: "We will invest the money carefully."
 FEE_Netherlands_Events.5.OPT2: "No, it's ours!"

 FEE_Netherlands_Events.6.T: "Formosa"
 FEE_Netherlands_Events.6.D: "With our expansion in the East Indies it is time to pose the ultimate challenge to our rivals, the Portuguese. We must begin trade with the Middle Kingdom and prove ourselves dominant in Asia. For this purpose, we need a base closer to China. The island of Formosa serves perfectly, being largely uninhabited and mere miles from China itself."
 FEE_Netherlands_Events.6.OPT1: "Establish a colony."

 FEE_Netherlands_Events.7.T: "Koxinga and Tungning"
 FEE_Netherlands_Events.7.D: "With the imminent collapse of the Ming Dynasty, a young general called Koxinga has fled to Northern Formosa, seeking to use it as a base to retake the mainland and restore Ming rule to China. The problem, of course, is that of our own colony in Formosa. Koxinga has issued us a demand to cede it, either willingly or by force."
 FEE_Netherlands_Events.7.OPT1: "A fractured China is worthless to us, concede the colony."
 FEE_Netherlands_Events.7.OPT2: "Over my dead body!"

 FEE_Netherlands_Events.8.T: "The Dutch Impede Us"
 FEE_Netherlands_Events.8.D: "In order to fight the pretenders to the Mandate of Heaven, we must first secure our own borders. Expel the Dutch from Taiwan!"
 FEE_Netherlands_Events.8.OPT1: "Lay Siege to Zeelandia!"
 FEE_Netherlands_Events.8.OPT2: "The Dutch are too powerful."

 FEE_Netherlands_Events.9.T: "The Supreme Court of Holland"
 FEE_Netherlands_Events.9.D: "While Den Haag has long served as the administrative center of the Hollanders, the steady increase of the region in population, wealth, and influence has required ever more legal protections and effective administration of justice, a need which has outgrown our institutions' ability to provide it. Especially important for an area so dependent on trade is the consistent and meaningful enforcement of contracts and the protection of property rights. These are two cornerstones of any successful economy. \nTo that end, it has been proposed that a new standardized court system be set up, one that not only is independent over legal matters in our lands, but also regulates commerce on the high seas going through our ports. \nThe flagship of this new court system would be in the Hague, the better to maintain independence from the merchant interests in fast-growing Amsterdam or the nobility interests further inland. "
 FEE_Netherlands_Events.9.OPT1: "Let the Hague be an example to the rest of the world!"

 FEE_Netherlands_Events.10.T: "The Corneliszoon Sawmill"
 FEE_Netherlands_Events.10.D: "While it may be a bit of an exaggeration to say that the sawmill was invented in Holland, since sawmills have existed since Roman times, Cornelis Corneliszoon was the first to craft a round saw blade that was attached via a pitman arm onto a windmill. This vastly increased the speed and efficiency at which a sawmill operated, and allowed for a rapid expansion of Dutch maritime capability."
 FEE_Netherlands_Events.10.OPT1: "Excellent!"

 FEE_Netherlands_Events.11.T: "Defensive Reforms"
 FEE_Netherlands_Events.11.D: "Since the Middle Ages, the Dutch have been unique in the world for their ability to build great dikes, walls to keep out the sea itself. More recently, wars of independence and the strategic vulnerability of our lands have trained us in the arts of building state-of-the-art forts on our frontiers. The invention of the bastion is just the latest in the European-wide arms race between defense and offense. We must be prepared to keep up to maintain our edge."
 FEE_Netherlands_Events.11.OPT1: "Spare no expenses in investing for our defense"
 FEE_Netherlands_Events.11.OPT2: "Our brave soldiers, not stone walls, are how we must defend ourselves"

 FEE_Netherlands_Events.12.T: "Michiel de Ruyter"
 FEE_Netherlands_Events.12.D: "While Michiel de Ruyter has already had a full and illustrious career, serving everything from a musket under Maurice of Nassau to a pirate-hunter aboard privately-owned ships, his latest assignment has brought him fully to our attention. \nWhile assigned as captain of a state-owned man-of-war hunting Portuguese raiders, he distinguished himself in combat against a combined Spanish and Portuguese fleet. \nThere, despite an cautious nature on land, he showed exemplary boldness and steadfastness in the face of dangerous undertakings. He would go down in history as one of the most skilled naval leaders in Dutch history."
 FEE_Netherlands_Events.12.OPT1: "He shall be made an admiral!"
 FEE_Netherlands_Events.12.OPT2: "His advice is essential for the state!"

 FEE_Netherlands_Events.13.T: "A Daring Attack"
 FEE_Netherlands_Events.13.D: "However regrettable the circumstances may or may not be, we find ourselves at war with the English over the question of naval supremacy. However, word has been leaked that the English have been forced to lay in their fleet for repairs due to budget concerns. \nTo most navies, this would put them safely out of reach for repairs. But we will not be so easily discouraged. One of our leading politicians, working in conjunction with one of our best admirals, has devised a bold operation the likes of which has never been attempted against the English navy. He proposes to sail our navy into the mouth of the Thames itself, engage the fortifications there directly and attack the English fleet while it is unable to move or defend itself."
 FEE_Netherlands_Events.13.OPT1: "Fortune favors the bold!"

 FEE_Netherlands_Events.14.T: "Raid on the Medway"
 FEE_Netherlands_Events.14.D: "Utter disaster has befallen our glorious fleet! Despite ample warning by our spies in Holland, the Naval Board completely discounted the idea that the Dutch would dare launch an attack into the Thames itself. Imagine our shock, then, when a morning fog lifted to reveal the horrible sight of the entire Dutch navy bearing down on the Thames! \nhe Dutch broke through out defensive chains and burned many of our finest ships, even capturing the flagship itself! Many prominent voices begin to fear that a defeat of this scale might prove the undoing of the whole kingdom. The city of London has flown into a panic of the now-dreaded Dutch! And well they might, for this will go down in history as the worst defeat ever suffered by the Royal Navy, and one of the worst in all our military history!"
 FEE_Netherlands_Events.14.OPT1: "Horrors!"

 FEE_Netherlands_Events.15.T: "Raid on the Medway"
 FEE_Netherlands_Events.15.D: "Totally unprepared for our bold move, we have inflicted nothing short of catastrophe on the enemy navy! We even managed to unmoor two of the best ships and take them back to Amsterdam for ourselves. \nThis great victory has reinvigorated the people in this war, and will doubtless lead to a more favorable peace deal as well as go down in history. Celebrations of this victory continued through the night throughout the nation"
 FEE_Netherlands_Events.15.OPT1: "Glorious!"

 FEE_Netherlands_Events.16.T: "Dutch Settlers at the Cape"
 FEE_Netherlands_Events.16.D: "nitially, the only Dutch presence at the Cape of Good Hope was a VOC supply post for ships on the way to the Indies. It was never thought that it would become a destination for Dutch settlers; indeed, for much of the history of the Republic we have been a destination for immigrants rather than a source of emigration. \nLately, however, rumors of rich farmland and a labor shortage in the VOC has encourage a rare outpouring of Dutch migration there. Dutch Calvinists, mostly farmers from the interior Netherlands where trade wealth wasn't as abundant as on the coast, were the majority of the immigrants, but they were quickly followed by Germans and French Huguenots as well. Soon, the immigrants even ventured out beyond the Cape, which itself was becoming a developed city in its own right. \nDespite this influx, the VOC has been reticent to invest any more into the well-being of the colony, treating it as little more than a glorified campsite."
 FEE_Netherlands_Events.16.OPT1: "Encourage the settlers of Cape Town!"
 FEE_Netherlands_Events.16.OPT2: "Encourage the settlement of the hinterlands!"
 FEE_Netherlands_Events.16.OPT3: "This is a matter for the VOC alone"

 FEE_Netherlands_Events.17.T: "The Grand Alliance"
 FEE_Netherlands_Events.17.D: "It has been a geopolitical constant of Europe that France, with its huge population, fertile soil, and absolutist rule has been the most powerful nation in Western Europe, if not all of the European continent. \nWith the weakening of the Holy Roman Emperor, long the counterweight to French ambitious, by religious wars, and even rumors of a Franco-Ottoman alliance, [Root.Monarch.GetName] has decided that it is high time the powers of western Europe formalize their intention to contain France. Accordingly, all nations with an interest in doing so shall receive invitations to meet in the Hague and form a Grand Alliance against the French."
 FEE_Netherlands_Events.17.OPT1: "Let the Treaty be signed!"
 FEE_Netherlands_Events.17.OPT2: "On second thought, we can handle this ourselves"

 FEE_Netherlands_Events.18.T: "Rembrandt"
 FEE_Netherlands_Events.18.D: "Rembrandt Harmenszoon van Rijn, commonly known simply as Rembrandt, was a Dutch painter, printmaker, and draughtsman from Leiden. An innovator in all three distinct art media, he is widely considered one of the greatest artists in history and single-handedly embodied the Dutch Golden Age of the arts. He became famous for his intimate and brooding self-portraits, prints of scenes from the Bible, and his pioneering work in the technique of etching. \nIn opposition to the prevailing Baroque style of the age, and to the art styles which preceded them, Rembrandt's paintings, like those of other Dutch masters, presented ordinary life scenes as objects of high art. This “democratization” of art showed such empathy for ordinary human life that he was called “one of the great prophets of civilization."
 FEE_Netherlands_Events.18.OPT1: "A true master of the arts!"

 FEE_Netherlands_Events.19.T: "Huguenot Refugees"
 FEE_Netherlands_Events.19.D: "The relatively tolerant order established in France after the French Wars of Religion is rapidly deteriorating. The rise of absolutism in our larger neighbor has led to the revocation of legal protections for the French minority of Protestants known as Huguenots. In addition, the continued actions of the Inquisition in Spain and religious conflicts ongoing in Germany have made our Republic into an island of peace and stability. While constant conflict in Europe results in rampant poverty, in Amsterdam there are always jobs! \nNaturally, these people of all faiths wish to seek a better life in our trading cities."
 FEE_Netherlands_Events.19.OPT1: "By all means, let them in!"
 FEE_Netherlands_Events.19.OPT2: "They would only bring all their problems here"

 FEE_Netherlands_Events.20.T: "Dike Piercing"
 FEE_Netherlands_Events.20.D: "Come my friends, the Dutch are going to war! It is likely that we go to our doom. The last march of the Dutch!"
 FEE_Netherlands_Events.20.OPT1: "Break the dikes! Release the water!"
 FEE_Netherlands_Events.20.OPT2: "Our business is to fight, not flee!"

 FEE_Netherlands_Events.21.T: "Lack of Investment in Manufacturing "
 FEE_Netherlands_Events.21.D: "Our dominance of the global trade networks has brought unprecedented wealth to our shores. Even as other nations begin to copy our techniques for trade and ship-building, we ourselves have become complacent. Many merchants seem content to continue accruing profit from existing trade routes, heedless of the looming competition, while our investors find foreign opportunities more lucrative than our own nation swamped in excess capital. \nOur emphasis on trade has led us this far, but an investment into our nations manufacturing capacity is critical if we are to avoid being left behind by other nations. Alternatively, some suggest that we could pawn our gains from trade back into the finances markets which so helped us before, that we may create a self-reinforcing cycle of financial growth without additional spending or investment."
 FEE_Netherlands_Events.21.OPT1: "The world is changing, and industry is the future"
 FEE_Netherlands_Events.21.OPT2: "The investment of capital is core to a nation's success"
 FEE_Netherlands_Events.21.OPT3: "Trade is the lifeblood of nations, we would be foolish to abandon it now"
 FEE_Netherlands_Events.22.T: "The States General"
 FEE_Netherlands_Events.22.D: "While we have brought stable and loyal governance to the rich trade lands of the Low Countries, these provinces have long held a fierce traditions of local rights and privileges. At the same time, with the decline of the Hanseatic League, the merchants of the Low Countries are amassing ever more wealth and influence with which to back up their demands. \nThese bourgeoisie, along with prominent nobility and bishops of our subjects, have gathered to request a general meeting of delegations from all our subject states, called the States General."
 FEE_Netherlands_Events.22.OPT1: "Convene the States General!"
 FEE_Netherlands_Events.22.OPT2: "These shopkeepers need to stick to their trades and stay out of politics"

 FEE_Netherlands_Events.23.T: "Baltic Grain"
 FEE_Netherlands_Events.23.D: "Situated perfectly at the confluence of the Baltic Sea, English Channel, and Rhine River trade routes, Amsterdam grew in importance and influence throughout the 15th century. As the Hanseatic League to the east began to lose coherence, merchants from Amsterdam increasingly filled the vacuum in the Baltic Sea. The growing population of the Lowlands also led to an increased demand for grain from the Baltic shores, since land could no longer be reclaimed fast enough to keep up with demand for food. \nThe upshot of all this was that Amsterdam would become the primary port in Europe for the important and distribution of grain from the Baltic."
 FEE_Netherlands_Events.23.OPT1: "Excellent!"

 FEE_Netherlands_Events.24.T: "The Frisian Peasant Rebellion"
 FEE_Netherlands_Events.24.D: "The area of Frisian has long been known for its “Frisian Freedom,” the near-complete absence of feudalism and serfdom that was known almost nowhere else in the world during the Middle Ages. However, external forces gradually eroded the Frisian Freedom through military efforts or even outright buying off of local power brokers. By 1498, the Freedom was all but gone, and Imperial forces would occupy Frisia. \nIt wouldn't take long before this occupation and revocation of ancient freedoms, stemming from the time of Charlemagne himself, would be rejected by the population. Things came to a head when the Black Band, a mercenary company stationed to maintain order, extracted “payment” by looting local villages."
 FEE_Netherlands_Events.24.OPT1: "How dare they?"
 FEE_Netherlands_Events.24.OPT2: "Give them their freedom, we have more important concerns now"

 FEE_Netherlands_Events.25.T: "La Furia Espanola"
 FEE_Netherlands_Events.25.D: "During the Eighty Years' War, or Dutch Revolt, the many Spanish tercios of the Army of Flanders under Julian Romero, employed to purge the anti-Catholic heresy and bring the rebel provinces of Holland and Zeeland back into line were growing restless. They were weary of endless fighting with little to no rest, and frustrated at their lack of pay by the Spanish Crown. The troops had their pay delayed due to Spain's recent declaration of bankruptcy, leading to the bankers refusing to authorise payment until they had negotiated with Phillip II. This meant that the King had to send the physical money by sea, which was much more perilous. To make matters worse, 400,000 florins intended for the soldiers were seized by the English after the ships carrying them were forced to take refuge in English ports during a storm. This pushed the tercios too far. They decided to find their pay for themselves, as was a time old tradition, by sacking a major city. They chose the de facto capital of the Seventeen Provinces at the time, Antwerp, from which to take what they were owed. This was due to the treachery of the Spanish commander of Antwerp Citadel, Sancho d'Avila. He attempted to convince the commander of the garrison of German mercenaries to deliver the city into Spanish hands. This, however, had the opposite effect. The Germans began to improvise defences against the Spaniards and a day before the mutinying tercios arrived, 6,000 Walloon mercenaries were let into the city to help defend it. This was not enough, unfortunately for the city and its citizens. The defences were overrun by the professionally trained soldiers and the Walloon troops not only failed to defend the city, but even fled or participated in the looting ofAntwerp. The few remaining Germans and the civilians were massacred, some 7,000 lives lost."
 FEE_Netherlands_Events.25.OPT1: "God punishes those who do not obey him."
 FEE_Netherlands_Events.25.OPT2: "Punish these treacherous mutineers!"

 FEE_Netherlands_Events.26.T: "The Spanish Fury"
 FEE_Netherlands_Events.26.D: "The treacherous Spaniards have sacked Antwerp! Those uncouth dogs have destroyed the jewel of the Netherlands, and we must take revenge. We are called upon by God to avenge the deaths of these innocents, and to punish the Spanish for their tyranny and insolence! For now, bury the dead and repair the damage. This is truly a death knell for Antwerp and a black day for our people."
 FEE_Netherlands_Events.26.OPT1: "The star has faded forever more."

 FEE_Netherlands_Events.27.T: "Gent Revolts"
 FEE_Netherlands_Events.27.D: "The Ghent Revolt of 1449 to 1453 was a crucial chapter in the struggle between the powerful Flemish city of Ghent and the Burgundian ruler Philip the Good. The conflict was part of a long tradition of uprisings in which the citizens of Ghent, known for their resistance to unjust governance by the nobility, fought for their rights and freedoms. In the 14th and 15th centuries, the citizens of Ghent had brought the city to economic prosperity and had entrenched the privileges of the guilds and small trades into the city's governance. After the Battle of the Golden Spurs in 1302, the citizens had gained political influence, leading to a system where the city was governed by three groups: the citizens (poorters), the weavers' guild, and the guilds of the smaller trades. This system was known as the regime of the Three Members. Philip the Good, Duke of Burgundy and Count of Flanders, sought from the 1430s onward to curtail the power of the guilds and restore the political system that existed before the Battle of the Golden Spurs. He found the influence of the guilds, particularly their deans, to be at odds with the Charter of Senlis of 1301. Additionally, Philip needed steady income and proposed new taxes, including a semi-permanent salt tax. At the time, salt was crucial for food preservation, and taxing it would provide significant revenue. However, the city government of Ghent strongly opposed the tax, basing their resistance on their old privileges and customary rights. After two years of negotiations, the tax was finally rejected. When Philip accused the city's deans of perjury and removed them from the Great Council, the conflict escalated. The citizens of Ghent responded with strikes and armed rebellion. In October 1451, the revolt openly broke out with the capture of Biervliet. The situation worsened, particularly when the rebels began killing their opponents within the city, losing the support of other Flemish cities in the process. On May 31, 1452, Philip the Good officially declared war. The citizens of Ghent launched military campaigns to secure their supplies, capturing various strategic locations in the surrounding area, including castles and bridges along the Scheldt and Dender rivers. Despite initial successes, such as the victory at Nevele and a large artillery duel during the siege of Oudenaarde, the Burgundian forces began to gain the upper hand. Philip managed to reinforce his garrisons and besieged Ghent itself in May 1452. The citizens continued to defend the city, but their position worsened with each passing month. By July 1453, Philip launched a decisive military campaign. His forces captured Schendelbeke and destroyed the castle of Poeke. The final battle took place at the castle of Gavere. After five days of artillery bombardment, the Ghent lines broke when a careless gunner dropped his match into a gunpowder barrel, causing panic. The Ghent army fell into chaos and was devastatingly defeated by the Burgundian troops. An estimated 16,000 to 20,000 citizens of Ghent perished in the Battle of Gavere, effectively breaking the rebellion. After their defeat, the citizens of Ghent were forced to surrender in a humiliating manner to Philip the Good. On their knees, in their shirts, and speaking in French, they begged for forgiveness. The Treaty of Gavere officially ended the revolt, marking a decisive step in the centralization of Burgundian power. The conflict not only demonstrated the growing power of modern gunpowder artillery but also symbolized the victory of central authority over urban autonomy. With this victory, Philip the Good had solidified his grip on Flanders, taking a significant step toward consolidating his control over the Low Countries."
 FEE_Netherlands_Events.27.OPT1: "Let us grant the Ghentenars what they wish"
 FEE_Netherlands_Events.27.OPT2: "To arms! This revolt must be crushed forcefully"

 FEE_Netherlands_Events.28.T: "Dulle Griet"
 FEE_Netherlands_Events.28.D: "A great forging has begun across Europe, a forging of a new weapon of power: the bombard. Henry V, the great King of England, forged his for the Hundred Years' War to further his dynasty's long-held ambition to extend his dominion over all of France. Jean Bureau, the crafty engineer of France, answered in kind with his own. Meanwhile, in the land of the Ottomans, yet another great bombard was cast, one to snuff out the indomitable Romans cast by the great mastermind Orhan. But they were all deceived, for there was another forging… \nIn the land of Burgundy, the Duke, Phillip the Good, began to devise a new cannon design. Into it he poured a great part of his skill, his resources, and his cunning. One cast to rule them all. Twins, they were, that were forged. One, Mons Meg was given to James II of Scotland, fair and wise in his own right, where it smote the fortresses of Scotland's enemies. The other went to Flanders, the jewel of Phillip's wealthy and powerful realm. \nHowever, it would be Phillip who in the end was deceived, as his cannon proved in fact too large and too powerful to be effective in combat or affordable in sieges. However, it proved a valuable lesson, and while it was never fired in anger, it inspired awe and terror in the hearts of all the enemies of Burgundy, for who now could stand against such a mighty machine of war? In Gent it would stay, gradually turning red from rust and becoming known as Dulle Griet (Mad Meg) or the Red Devil."
 FEE_Netherlands_Events.28.OPT1: "The world is changing…"

 FEE_Netherlands_Events.29.T: "The Church of the Holy Blood (Renovation)"
 FEE_Netherlands_Events.29.D: "Flanders may appear to be an odd place for one of the most prized relics of Christendom, sitting on the North Sea coast and far from any ecclesiastical center or the Holy Land. Yet, the enterprising Flemish had never let such considerations as distance stop them before, and the relic of the Holy Blood in Bruges is no different. The audacious Thierre of Alsace managed to secure the vial while on the Second Crusade, bringing it back with him to Flanders and causing the construction of the Church of the Holy Blood to house it. During the 13th century, the church was promoted to the status of minor basilica, which it maintains to this day. By [GetYear], the basilica still welcomed parishioners and pilgrims alike, marvelling at its wall paintings and Romanesque structure. However, it became clear that the space was inadequate for parishioners given the growing pressure from pilgrims. The Count of Flanders has been petitioned to sponsor a renovation and additional chapel space around the basilica itself."
 FEE_Netherlands_Events.29.OPT1: "Of course! We shall honor this precious blood, spare no expense!"
 FEE_Netherlands_Events.29.OPT2: "A new chapel is perfectly fitting for this holy place"
 FEE_Netherlands_Events.29.OPT3: "Not enough gold, my lord"

 FEE_Netherlands_Events.30.T: "Building of Brugge City Hall"
 FEE_Netherlands_Events.30.D: "Flemish cities had long been dominated by their belforten, the fortified towers that enshrined their city rights. Over time, however, the need for an expanded center of city governance made the building of new civic buildings necessary. Very few places was this as true in Bruges, long the queen of Flemish cities and one of the wealthiest cities in the world. After the old Belfry was destroyed by fire in 1280, the burghers of the city funded the building of a new city hall, one whose beautiful architecture, flamboyant interior art, and impressive vault would make it the envy of its neighbors. Built in the Gothic style and decorated on the interior council chamber with rich paintings chronicling the city's history, it was a tribute to the city's prosperity."
 FEE_Netherlands_Events.30.OPT1: "Marvelous!"

 FEE_Netherlands_Events.31.T: "Brussels Town Hall Finished!"
 FEE_Netherlands_Events.31.D: "First begun in 1401, the Town Hall of Brussels was built in several stages as Brussels began to grow in prominence under the Burgundian state. Young Charles the Bold placed the first stone for its west wing in 1444, with its intricate edifice and Brabantine Gothic tower designed by Jan van Ruysbroek, the architect of Phillip the Good. Legend has it that, despite the magnificence of the structure, van Ruysbroek threw himself to his death off its great tower upon noticing that the tower was slightly off-centered. \nTown halls with high towers, called belforten, had become common in the wealthy cities of Flanders and Brabant, but the Brussels Town Hall was the pinnacle of its kind, and down through modern times would rank as one of the most beautiful civic buildings ever built. Just as it marked the peak of town hall building in the Low Countries, it also marked the peak of Burgundian wealth and power in the region, and the peak of Brussels' importance as a city during the early modern period."
 FEE_Netherlands_Events.31.OPT1: "Wondrous!"

 FEE_Netherlands_Events.32.T: "Move the capital (burgundy only)"
 FEE_Netherlands_Events.32.D: "When the Dukes of Burgundy acquired the Low Countries, they soon realized that their realm's true power and potential no longer lay within the borders of Burgundy itself. While Burgundy remained the military heart of their domain, with its aristocracy and industry still rooted in its old soil, the political, economic, and societal center of their realm had shifted northward to the southern Low Countries, specifically, to the prosperous duchies of Flanders and Brabant. Faced with this reality, the Dukes knew that in order to establish lasting authority over their newly acquired lands, they needed to reshape their rule to reflect this new center of power. Recognizing the growing importance of the southern Low Countries, the Burgundian Dukes, along with their advisors, embarked on a mission to assert their dominance in a way that would ensure stability and control over their vast realm. If the center of their dominion had indeed shifted, they reasoned, they might as well embrace it entirely and move their political capital to this new heartland. But the decision of where to place this new capital was far from easy. At first glance, the wealthiest and largest cities of the region, such as Ghent, Bruges and Antwerp in Flanders, seemed like natural choices for a capital. However, these cities presented a significant obstacle: their fiercely independent traditions and entrenched city rights made them resistant to direct rule by a monarch. Ghent, for example, was known for its strong civic institutions and rebellious spirit, while Bruges was a major economic hub with little interest in bowing to royal authority. Antwerp had in the past shown their reluctance for trust in the dukes. While loyal at every turn to our authority and while they are in the best position to become the capital with the council of mechelen and their strategic location. This choice and further favoritism could trigger major revolts from the other cities. As a result, the Burgundian Dukes wisely avoided trying to impose direct rule over these cities. Instead, they established princely palaces within them and reached agreements to maintain permanent residences for members of the ducal family, ensuring a direct link between the Burgundian court and these crucial urban centers while avoiding confrontation over their autonomy. With the major cities of Flanders out of the running, the Dukes turned their attention to central Brabant, a region renowned for its production, military prowess, and academic standing. Brabant was home to Leuven, the ancient capital and seat of the prestigious University of Leuven, the only university in all of the Low Countries at the time. Just south of Leuven lay Brussels, a burgeoning trading city that had the potential to serve as a moldable and cooperative new capital. Brussels, at the time, was on the rise but still small enough to avoid the entrenched autonomy and urban pride that characterized the larger Flemish cities. Its strategic location, combined with its proximity to Leuven, made it an ideal candidate for the Burgundian court's new seat of power. The city was perfectly positioned for growth, and its relatively youthful status as a metropolis meant the Dukes could more easily shape it according to their needs and desires. The Dukes of Burgundy moved swiftly to solidify Brussels as their new capital. They took residence in the Koudenberg Castle, the ancient seat of the Dukes of Brabant, which overlooked the city. Over time, they transformed the modest castle into a grand palace, the palace of Koudenberg, which they expanded and embellished to rival the courts of Vienna and the kings in Paris. This palace became the epicenter of Burgundian power and the permanent home of the ducal court, marking Brussels as the new political capital of the Burgundian realm. \nBy shifting the capital to Brussels, the Burgundians established a central hub that would unify their vast territories. The court's presence in Brussels helped foster a closer relationship between the Dukes and the southern Low Countries, particularly Brabant, which had now become a key player in the Burgundian state. This move also signaled a broader political and cultural shift that would influence the development of the Low Countries for centuries to come. \nThrough this strategic decision, the Burgundian Dukes cemented Brussels as the heart of their realm, and with it, the southern Low Countries became the focal point of their vast empire. The city grew into a vibrant center of trade, politics, and culture, setting the stage for its future role as the capital of what would later become Belgium. This move by the Dukes of Burgundy laid the foundation for Brussels' emergence as one of the most important political centers in Europe."
 FEE_Netherlands_Events.32.OPT1: "Brussels shall become the new jewel of Europe!"
 FEE_Netherlands_Events.32.OPT2: "[Root.Capital.GetCapitalName] will continue to serve us just as well"

 FEE_Netherlands_Events.33.T: "Decline of Brugge and Rise of Antwerpen"
 FEE_Netherlands_Events.33.D: "The decline of Bruges is the story of a city that once stood at the pinnacle of European trade, only to be undone by the forces of geography, politics, and economic shifts. In the 13th and 14th centuries, Bruges was one of Europe’s most important commercial centers. Strategically positioned on the Hanseatic League’s trade routes and connected to the North Sea via the Zwin River, it attracted merchants from England, France, Italy, and Spain. Its belfry tower, bustling markets, and canals were the symbols of its wealth and influence. Bruges became a focal point for the wool trade, transforming English wool into luxurious Flemish cloth sought across Europe. It also became a hub for banking and finance, attracting wealthy Italian bankers from Venice and Florence. The city’s bustling streets, filled with artisans and foreign merchants, created an atmosphere of immense cultural and economic vibrancy. But from the late 15th century onward, Bruges entered a period of gradual decline. The Zwin River, which connected the city to the sea, began to silt up, preventing large ships from reaching its port. Merchants and trade increasingly shifted to Antwerp, whose deep waters made it a more accessible hub. Politically, the death of Charles the Bold in 1477 and the ensuing conflicts between France and the Habsburgs destabilized the region. The once-prosperous city found itself cut off from major trade routes, and its fortunes dwindled. As Bruges’ economy contracted, its once-thriving markets fell silent, and its population began to shrink. Many merchants and artisans migrated to Antwerp or other cities, seeking new opportunities. The cultural vibrancy that had defined Bruges in its golden age, with artists like Jan van Eyck and Hans Memling, faded as patronage dried up. \nHowever, amidst this decline, a new industry quietly rose to prominence: lace-making. As Bruges lost its commercial stature, the city's artisans adapted, turning their attention to this intricate and labor-intensive craft. Lace-making had long existed in Flanders, but during Bruges' decline, it became a vital industry, especially for women who sought to support their households in the absence of larger industries. Lace from Bruges gained a reputation for its exceptional quality and craftsmanship. In an era when European nobility had a growing appetite for luxury goods, Bruges lace became highly sought after in the courts of France, England, and Spain. The city became a center of lace production, with women and girls learning the craft in schools and convents. The rise of lace helped cushion Bruges from the full impact of its economic decline, providing employment and preserving a part of its artistic heritage. Though Bruges never regained its former glory as a major trading hub, the city survived through its ability to reinvent itself. While Antwerp flourished as a port, Bruges became known for the delicate lace that adorned the garments of Europe’s elite. The intricate patterns of lace-making became a symbol of Bruges' resilience, a city that found new ways to thrive even as it lost its place at the center of European trade."
 FEE_Netherlands_Events.33.OPT1: "So passes the age of Bruges, and so begins the age of Antwerp"

 FEE_Netherlands_Events.34.T: "Potatoes in the Low Countries"
 FEE_Netherlands_Events.34.D: "Long a staple crop in the mist-shrouded Andes mountains of South America, the Columbian Exchange brought this hardy, cold-resistant, and high-calorie root to European shores. While initially looked down on by Europeans accustomed to grain-based diets, the potato would win over many due to its several innate advantages, including its higher nutritional value, its capacity to produce more harvests in a year than equivalent grain cultivation, and its adaptability to ground too poor or cold for grain. \nIn the Low Countries, the first record of a potato shows the tuber arriving in Antwerp from the Canary Islands in 1567. Independently, potatoes arrived in the Netherlands via the Pope, who gifted them to his ambassador in the Netherlands as a medicine after receiving them from Felipe II of Spain. By the end of the 17th century, the potato had become widespread in the  Low Countries, particularly the southern Lowlands, where the dense population made a more efficient crop vital. The conversion of the potato from an exotic curiosity to a European staple sparked a population boom in northern Europe, and it became an integral part of European cuisine from then onwards."
 FEE_Netherlands_Events.34.OPT1: "Boil 'em, mash 'em, stick 'em in a stew!"

 FEE_Netherlands_Events.35.T: "Flemish Baroque Painting"
 FEE_Netherlands_Events.35.D: "After the Flemish golden era during the 15th century, Flanders waned in power and cultural influence, but still remained a center of the arts. Some of their greatest artists, such as Pieter Paul Rubens and David Teniers the Younger, worked in the Flemish cities during the Baroque period, when, in contrast to Dutch Golden Age art, where mundane every day objects were glorified in art, the focus of the Flemish Baroque painters remained firmly on religious artworks, which Flemish painters and sculptors had focused on for centuries. \nWith the support of our government, we could usher in a new golden age of Flemish art."
 FEE_Netherlands_Events.35.OPT1: "Of course. They shall have our support!"
 FEE_Netherlands_Events.35.OPT2: "It’s not worth it"

 FEE_Netherlands_Events.37.T: "The Oostende Company"
 FEE_Netherlands_Events.37.D: "The Ostend Company, officially known as the General Imperial Indian Company, was an ambitious trading organization founded on December 19, 1722, in the Southern Netherlands, which at the time were under the rule of Habsburg Austria. In an attempt to break the trading dominance of the Dutch East India Company (VOC) from the Northern Netherlands, the Austrian emperor sought to secure his own share of the lucrative trade with Asia, Africa, and the Americas through this company. The initial phase was fraught with difficulties due to disagreements between the directors and the emperor over military obligations, but after a revised version of the charter in July 1723, the company was able to fully commence operations. With a starting capital of six million guilders, divided into 6,000 shares, and a monopoly on trade between the Southern Netherlands and various overseas regions, the Ostend Company quickly became a success story. The shares were completely sold out in just a day and a half, reflecting the support from the local elite and business community. The company primarily focused its trading activities on China and Bengal, with China becoming the central pillar of its operations. The Ostend Company was one of the first European businesses to fully dedicate itself to trade with Canton. The return cargoes to Europe, consisting of tea, silk, porcelain, and other luxury goods, were highly profitable. The trade routes followed by the ships were long and dangerous. A successful expedition could take up to 18 months, including time spent in Asia. Ostend, Antwerp, Ghent, and Bruges were important cities in the operation of the company. Ostend served as the main port for expeditions,with brugge and gent serving as the main recruiting banking and trading hubs center, while Antwerp was the administrative headquarters and major return port of the company."
 FEE_Netherlands_Events.37.OPT1: "Focus the Company on purely commercial efforts"
 FEE_Netherlands_Events.37.OPT2: "Focus the Company on securing vital trade posts"
 FEE_Netherlands_Events.37.OPT3: "On second thought, don’t bother with it"

 FEE_Netherlands_Events.38.T: "Frietjes!"
 FEE_Netherlands_Events.38.D: "The origins of fries are highly disputed, but nowhere is the claim as strong as in the southern Low Countries. According to local lore, the invention of fries took place during a famine in the Maas River region, where it was customary to eat small fried fish as an affordable source of protein. During a particularly harsh year marked by droughts and widespread food shortages, the rivers were too low to fish, and there wasn’t enough water to grow grain or most vegetables. However, one crop, previously dismissed as a viable food source, managed to survive in the gardens of monasteries and the clergy. This crop was the potato, which had been brought over from the New World but was mainly used for alchemical experiments at the time and not considered fit for consumption. According to the tale, one desperate fish vendor, facing the scarcity of fish, decided to experiment with potatoes. He sliced them into chunks resembling the size of the small fish he would typically fry, and then fried them in oil. These fried potato chunks, or “fries,” became a new staple and quickly gained popularity. The vendor, endearingly, simply called them “fried” or \"friet\", and thus, what we now know as fries, or “frietjes”, was born."
 FEE_Netherlands_Events.38.OPT1: "Fritjes! Fritjes for everyone!"
 FEE_Netherlands_Events.38.OPT2: "Surely just a passing fad…"

 FEE_Netherlands_Events.39.T: "The palace at Binche"
 FEE_Netherlands_Events.39.D: "The Palace or Castle of Binche was a former residence of the Counts of Hainaut, located in Binche in the Belgian province of Hainaut, of which only some wall remains exist today. The medieval castle and its subsequent Renaissance palace served as residences for the Counts of Hainaut, the Dukes of Burgundy, and the Habsburg rulers. The palace, built from 1545 onwards by order of Mary of Hungary, was intended to rival the grandeur of the French Palace of Fontainebleau. The origins of the Binche castle trace back to the 12th century, when Baldwin IV, known as Baldwin the Builder, Count of Hainaut, constructed it. He also built the city walls, which remain nearly entirely intact, a rarity in Belgium. By the 15th century, the castle was known as the Château de la Salle, and Philip the Good renovated it in 1461. Margaret of York received Binche as her widow's estate and expanded the castle around 1500. Mary of Hungary, who became the Governor of the Netherlands in 1528, was an avid hunter and spent much of her time in Binche. In 1545, her brother, Emperor Charles V, gifted her the town and the estates of Binche. Mary decided to demolish the medieval castle and replace it with a grand Renaissance palace. The appointed architect, Jacques Dubroeucq, who had previously worked on the nearby hunting lodge at Mariemont, began construction in December 1545, with the project taking over three years to complete. Dubroeucq drew inspiration from the Château de Boussu, which he had recently designed. He reused the foundations of the medieval castle, preserving only the wing that had been built under Margaret of York. The palace complex featured two towers, a main two-story building, two additional single-story wings, and a chapel. It housed various rooms, including galleries, dining rooms, kitchens, stables, and other structures. The most impressive features were the grand hall on the first floor, measuring 30 by 13.5 meters, and the private \"riche logis\" of Mary, measuring 18 by 9 meters. Mary commissioned artworks from renowned painters like Titian and Michiel Coxcie, as well as tapestries based on designs by Pieter Coecke van Aelst. She also designed a beautiful \"Garden of the Muses\" outside the palace, which was widely admired. In 1548, Emperor Charles V embarked on a tour through his dominions to secure the recognition of his son Philip as heir. On August 22, 1549, they arrived in Binche, where Mary hosted them with extravagant celebrations. For six days, feasts, balls, and tournaments took place in what became known as the \"Triumph of Binche\". Philip was so impressed by the grandeur of the palace that he later used Binche as inspiration for the royal palaces of Aranjuez, El Pardo, and Valsaín in Spain."
 FEE_Netherlands_Events.39.OPT1: "Spare no expense!"
 FEE_Netherlands_Events.39.OPT2: "We don’t need this kind of expense…"

 FEE_Netherlands_Events.40.T: "Walloon churches"
 FEE_Netherlands_Events.40.D: "The term Walloon church refers to Calvinist churches in the Netherlands and its former colonies that were established by and served Protestant refugees, particularly from the Southern Netherlands and northern France, who spoke French. These churches are part of the Walloon Reformed Church, which was a distinctive denomination within the broader Dutch Reformed tradition. The Walloon churches were formed during the Reformation, a period of significant religious, political, and social upheaval across Europe. In the Southern Netherlands and France, the spread of Calvinism in the 16th century was accompanied by severe persecution from Catholic authorities. This repression led to waves of migration, with many Protestants, particularly Walloons, fleeing to the more religiously tolerant Dutch Republic to escape persecution. The Netherlands, in contrast to the heavily Catholic Southern Netherlands, had embraced the Reformation, particularly Calvinism, and was emerging as a haven for religious refugees. French-speaking Calvinists, both Walloons and Huguenots, found a welcoming environment there, allowing them to freely practice their faith. Walloon churches were established to cater to these French-speaking Calvinist refugees. The Walloon churches became focal points not only for Walloons, french speaking flemish but also for Huguenots who fled from France due to persecution, particularly following the St. Bartholomew's Day Massacre in 1572 and the revocation of the Edict of Nantes in 1685. The revocation resulted in one of the largest waves of Huguenot emigration, as Protestantism was once again outlawed in France. Given the shared Calvinist faith, French language, and similar experiences of persecution and exile, the Huguenots and Walloons naturally integrated into the same religious communities. Many Huguenots joined the already-established Walloon churches, which were recognized for their use of French in worship. Although these churches were situated in the Dutch-speaking Netherlands, they maintained French as their liturgical language, becoming a cultural as well as religious refuge for French-speaking Protestants. The Walloon Reformed Church was a recognized and respected part of the broader Dutch Reformed Church. Many of them were skilled artisans, merchants, and intellectuals who contributed significantly to the economic and cultural life of the Dutch Republic. In cities like Amsterdam, Leiden, and The Hague, Walloon churches became important centers for the French-speaking Protestant community. They also played a critical role in the dissemination of Reformed theology, and some of their pastors and theologians contributed to the theological debates that shaped the broader Reformed tradition. Many Walloon congregations actively supported Protestant refugees from other parts of Europe and became part of the international Calvinist network. As the Dutch expanded their empire overseas, Walloon communities and churches followed. Walloon Calvinists played a notable role in the early Dutch colonies, particularly in the New World. For instance, the first Protestant church service in New Amsterdam is believed to have been conducted by a Walloon pastor. Walloon settlers were part of the initial group of Europeans who established the colony of New Netherland."
 FEE_Netherlands_Events.40.OPT1: "They have stayed faithful to God; we shall accept them as friends and brothers and help them build new homes here"
 FEE_Netherlands_Events.40.OPT2: "They are welcome here, or they may serve our church abroad"
 FEE_Netherlands_Events.40.OPT3: "Interesting to be sure, but not something to concern ourselves with"

 FEE_Netherlands_Events.41.T: "De Zeven Provinciën"
 FEE_Netherlands_Events.41.D: "In the year 1665, as tensions across European seas brewed and naval warfare became the defining contest of power, a new ship was born that would come to embody the might of the Dutch Republic De Zeven Provinciën. This majestic vessel, constructed at the Admiraliteitswerf in Rotterdam under the guidance of the renowned shipbuilder Salomon Jansz van den Tempel, was a product of Dutch maritime ingenuity. It measured 163 feet in length and 43 feet in width, towering above the waves with a draught of 16.5 feet and weighing an immense 1600 tons. Its 80 cannons and 2000 square meters of sail, combined with a crew of more than 420 men, made it one of the most powerful ships of its time. Though originally commissioned as the flagship for Vice Admiral Aert Jansse van Nes, it was when De Zeven Provinciën came under the command of the legendary Michiel Adriaenszoon de Ruyter that its true legacy would unfold. The year was 1666, and the Dutch Republic was embroiled in the Second Anglo-Dutch War, fighting to defend its maritime dominance from England. De Ruyter, one of the greatest admirals of his age, saw in this ship the perfect tool to strike at the heart of the enemy. The first test came with the Four Days' Battle in June 1666, one of the longest naval engagements in history. For four brutal days, De Zeven Provinciën led the Dutch fleet against the English, with its cannons thundering across the waves. De Ruyter’s brilliant tactics turned the tide of battle, and the English were forced to retreat. Later that year, the ship was at the forefront of the Two Days' Battle, another fierce engagement that demonstrated the strength of Dutch naval forces and the indomitable spirit of their crews and admiral. It was in June 1667 that De Zeven Provinciën achieved its most daring and spectacular feat, the Raid on the Medway. Under De Ruyter’s command, the Dutch fleet sailed into the heart of England’s defenses, up the River Medway, in a bold and audacious attack on the English navy. In an unprecedented victory, the Dutch destroyed several key ships, including the pride of the English fleet. The raid sent shockwaves through England and cemented the Dutch Republic’s reputation as a dominant maritime power. De Zeven Provinciën, leading this extraordinary campaign, became a symbol of its admiral’s audacity and military genius. In the years that followed, the ship continued to serve with distinction. It fought in the Battle of Solebay in 1672, where Dutch forces clashed with an Anglo-French fleet at the start of the Third Anglo-Dutch War. The following year, De Zeven Provinciën was present at the Double Battle of Schooneveld, where De Ruyter once again outmaneuvered the enemy, securing crucial victories that protected the Dutch coast from invasion. The ship was also present at the Battle of Texel in 1673, where it played a key role in ensuring Dutch independence during one of the most critical periods in the Republic’s history. In 1674, De Zeven Provinciën embarked on a new journey, this time across the Atlantic to the Caribbean. De Ruyter led a Dutch expedition to the French-held island of Martinique, where the ship took part in raids and military operations. This was to be one of De Ruyter’s final campaigns, as the great admiral died two years later, leaving behind a legacy as one of the most revered naval commanders in history. With De Ruyter’s passing, De Zeven Provinciën continued to serve under new captains. Rear Admiral Jan van Brakel and Johan Snellen both commanded the ship during subsequent naval battles, including the Battle of La Hougue in 1692. In this conflict, the ship fought valiantly as part of a combined Anglo-Dutch fleet against the French. Despite being heavily damaged, it remained a formidable presence on the seas. Yet, as with all great vessels, its time eventually came to an end. In 1694, after nearly three decades of service, *De Zeven Provinciën* was decommissioned and sold for scrap. The great ship however would forever live on as a symbol not only for its admiral Michiel de Ruyter but for its crew and the brave people of the Staatse Vloot. Forever eternalising it as the ship, the fleet and the admiral that not only beat single handedly two of the greatest navy of its time while being heavily outnumbered. Its also seen as a symbol of what allowed the dutch to flourish for if De Ruyter and his flagship and fleet had failed dutch history would look a whole lot different today."
 FEE_Netherlands_Events.41.OPT1: "None shall equal her on the seas!"
 FEE_Netherlands_Events.41.OPT2: "We do not need such toys"

 FEE_Netherlands_Events.42.T: "Blue Marble"
 FEE_Netherlands_Events.42.D: "In the lands of Wallonia, nestled in the southern heart of Belgica, there lies a stone not of marble’s truest form but of equal majesty, Blue marble. Though its name misleads, this stone is not a metamorphic marble but a fine limestone, quarried from deep beneath the Earth’s surface. Blue marble, known for its dark grays, blacks, and vivid polychromes of red and pink, has long captivated the eyes of masons, artists, and kings. It is from these quarried lands, near cities such as Namur, Dinant, Tournai, and Mazy. The story of Blue marble stretches back to the days of the Roman Empire. The quarries of Wallonia supplied stone to Roman Gaul, and even to Rome itself, where it graced buildings such as the Basilica of Junius Bassus. From these beginnings, Blue marble found its place in the decorative and structural arts, appreciated for the intricate patterns that emerge when its surfaces are polished. As the centuries passed, the demand for this limestone marble, and its reputation as a noble stone spread across Europe. During the Renaissance, Blue marble came into its full glory, adorning the halls and facades of Europe’s grandest structures. With its deep, royal red hues, and with its striking black, became the chosen materials of the aristocracy. The stone was used in the halls of the Palazzo Pitti in Florence and played a key role in the decoration of the majestic Palace of Versailles in France. Blue marble became synonymous with refinement, luxury, and European grandeur. In these days of flourishing architecture and arts, Belgian marble was more than a stone, it was a statement of power and prestige. Churches and palaces bore its polish, and the stone became an emblem of Renaissance Europe's cultural rebirth, a symbol of connection between the past glories of Rome and the burgeoning creativity of the present. Yet beyond its aesthetic allure, the legacy of Bleu marble extended into the economic and social fabric of the region. The quarries of Wallonia became hubs of activity, driving local economies and establishing the reputation of wallonia as a center for fine craftsmanship. Master masons from Wallonia became highly sought after, and their works stood as testaments to the ingenuity and skill of those who could shape the earth’s raw materials into works of beauty. The effects of it are felt in the very character of the region itself. The stone fostered a tradition of fine craftsmanship that would carry through the centuries, influencing not only architecture but also the local industries of stone cutting, finishing, and artistic creation. Even as new materials and trends emerged, Belgica marble remained a mark of distinction."
 FEE_Netherlands_Events.42.OPT1: "Sponsor its production!"
 FEE_Netherlands_Events.42.OPT2: "Yes yes, very nice, but what’s in it for me?"
 FEE_Netherlands_Events.42.OPT3: "We cannot indulge in this fancy rock"

 FEE_Netherlands_Events.43.T: "Dutch Fleet Captured at Den Helder!"
 FEE_Netherlands_Events.43.D: "In a remarkable, and rather odd all things considered, turn of events, we have received word of a rare interaction between cavalry and naval warships. An ambitious cavalry commander, encountering the Dutch warships at anchor near Den Helder, frozen in by an unusually cold winter, made an audacious decision. After putting cloth on his men’s horses’ hooves, he led a cavalry charge across the ice in a night attack, capturing 5 ships of the line, 3 frigates, 6 corvettes, and 4 cutters, all without firing a shot."
 FEE_Netherlands_Events.43.OPT1: "A surprise, to be sure, but a welcome one!"

 FEE_Netherlands_Events.44.T: "Dutch Fleet Lost at Den Helder!"
 FEE_Netherlands_Events.44.D: "In what will go down in history as one of the most humiliating moments of the storied, and at times almost legendary, Dutch navy, a brigade of French cuirassiers have captured 18 of our finest vessels without firing a shot! Riding with muffled hooves across the ice that froze in our ships, the cavalry was able to ride straight up to our admiral and demand his surrender. Shocked by such an unlikely and unprecedented turn of events, our men had little choice but to comply. While this does not cripple our entire naval strength, a strike this deep into our territory by land units at our fleet will wound our navy’s pride for some time…"
 FEE_Netherlands_Events.44.OPT1: "He can’t do that! Shoot him, or something!"

